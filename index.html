<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17324d" />
  <title>여행경비 플래너</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">TRAVEL BUDGET</div>
      <h1>여행경비 플래너</h1>
    </div>
    <button id="resetBtn" class="ghost danger">초기화</button>
  </header>

  <main class="container">
    <section class="card hero-card">
      <div class="hero-top">
        <div>
          <p class="muted">여행</p>
          <h2 id="tripTitle">나의 여행</h2>
        </div>
        <div class="pill" id="tripDays">0일</div>
      </div>
      <div class="stats">
        <div><span>총 예산</span><strong id="budgetStat">0원</strong></div>
        <div><span>총 지출</span><strong id="spentStat">0원</strong></div>
        <div><span>남은 예산</span><strong id="remainStat">0원</strong></div>
      </div>
    </section>

    <nav class="tabs" aria-label="앱 메뉴">
      <button class="tab active" data-tab="calendar">달력</button>
      <button class="tab" data-tab="records">지출기록</button>
      <button class="tab" data-tab="checklist">체크리스트</button>
      <button class="tab" data-tab="settings">여행설정</button>
    </nav>

    <section id="calendar" class="tab-panel active">
      <div class="card calendar-card">
        <div class="calendar-head">
          <button id="prevMonth" class="icon-btn" aria-label="이전 달">‹</button>
          <h3 id="monthLabel"></h3>
          <button id="nextMonth" class="icon-btn" aria-label="다음 달">›</button>
        </div>
        <div class="weekdays">
          <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>

      <div class="card">
        <div class="section-title-row">
          <div>
            <p class="muted">선택 날짜</p>
            <h3 id="selectedDateLabel">날짜를 선택하세요</h3>
          </div>
          <div class="daily-total" id="selectedDayTotal">0원</div>
        </div>

        <form id="expenseForm" class="form-grid">
          <label>구분
            <select id="category">
              <option>식비</option><option>카페</option><option>교통</option><option>쇼핑</option>
              <option>관광</option><option>숙박</option><option>항공</option><option>통신</option><option>보험</option><option>기타</option>
            </select>
          </label>
          <label>내용
            <input id="description" placeholder="예: 라멘" required />
          </label>
          <label>결제수단
            <select id="payment">
              <option>카드</option><option>현금</option><option>트래블카드</option><option>간편결제</option><option>기타</option>
            </select>
          </label>
          <label>통화
            <select id="currencyMode">
              <option value="foreign">외화</option>
              <option value="krw">원화</option>
            </select>
          </label>
          <label>금액
            <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="예: 1500" required />
          </label>
          <label>메모
            <input id="memo" placeholder="선택사항" />
          </label>
          <button class="primary full" type="submit">지출 저장</button>
        </form>
      </div>
    </section>

    <section id="records" class="tab-panel">
      <div class="card">
        <div class="section-title-row">
          <div><p class="muted">자동 저장됨</p><h3>지출 기록</h3></div>
          <button id="exportBtn" class="ghost">CSV 내보내기</button>
        </div>
        <div id="recordsList" class="records-list"></div>
      </div>
    </section>

    <section id="checklist" class="tab-panel">
      <div class="card">
        <div class="section-title-row">
          <div><p class="muted">여행 준비</p><h3>체크리스트</h3></div>
          <div class="pill" id="checkProgress">0%</div>
        </div>
        <div id="checklistList" class="checklist-list"></div>
      </div>
    </section>

    <section id="settings" class="tab-panel">
      <div class="card">
        <h3>여행 설정</h3>
        <form id="settingsForm" class="form-grid">
          <label>여행 이름
            <input id="tripName" placeholder="예: 오사카 3박 4일" />
          </label>
          <label>여행지
            <input id="destination" placeholder="예: 일본 오사카" />
          </label>
          <label>시작일
            <input id="startDate" type="date" />
          </label>
          <label>종료일
            <input id="endDate" type="date" />
          </label>
          <label>인원
            <input id="people" type="number" min="1" value="2" />
          </label>
          <label>총 예산(원)
            <input id="budget" type="number" min="0" step="1000" value="1000000" />
          </label>
          <label>외화 선택
            <select id="currencyCode">
              <option value="JPY">JPY · 일본 엔</option><option value="USD">USD · 미국 달러</option>
              <option value="EUR">EUR · 유로</option><option value="CNY">CNY · 중국 위안</option>
              <option value="TWD">TWD · 대만 달러</option><option value="THB">THB · 태국 바트</option>
              <option value="VND">VND · 베트남 동</option><option value="GBP">GBP · 영국 파운드</option>
              <option value="AUD">AUD · 호주 달러</option><option value="CAD">CAD · 캐나다 달러</option>
            </select>
          </label>
          <label>1,000원 = 외화 몇 단위?
            <input id="foreignPer1000" type="number" min="0.0001" step="0.001" value="107" />
          </label>
          <button class="primary full" type="submit">여행 설정 저장</button>
        </form>
        <p class="hint">예: 1,000원이 약 107엔이면 107을 입력합니다. 외화 지출은 자동으로 원화 환산됩니다.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
